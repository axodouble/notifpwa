<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{.AppName}}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.png">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="stylesheet" href="/style.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1edee">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#182027">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Lora:ital,wght@0,400..700;1,400..600&family=Rethink+Sans:wght@400..700&display=swap" rel="stylesheet">
  <script>window.VAPID_PUBLIC_KEY = "{{.VapidPublicKey}}";</script>
</head>
<body>
  <header class="site-header">
    <span class="site-brand"><img src="/icon.png" alt="">{{.AppName}}</span>
  </header>

  <main class="content">
    <p class="eyebrow">Push notifications</p>
    <h1>{{.AppName}}</h1>
    <p class="sub">Get push notifications on this device</p>

    <div class="action">
      <button type="button" id="enable">Enable notifications</button>
    </div>
    <p id="status" class="status">Checking…</p>

    <div class="note" id="ios-hint" hidden>
      <span class="label">On iPhone / iPad</span>
      Tap the Share icon → <b>Add to Home Screen</b>, then open the app from your
      Home Screen and press Enable. Notifications only work from the installed
      app (iOS 16.4+).
    </div>

    <section id="rooms" hidden>
      <hr>
      <p class="eyebrow">Rooms</p>
      <div id="room-list"></div>
      <form id="room-join">
        <label class="label" for="room-name">Join a room</label>
        <span class="join">
          <input type="text" id="room-name" placeholder="room name"
                 autocapitalize="off" autocomplete="off" spellcheck="false">
          <button type="submit">Join</button>
        </span>
      </form>
      <p id="room-msg" class="room-msg" hidden></p>
    </section>
  </main>

  <footer class="site-footer">
    <span class="muted mono">{{.Version}}</span>
  </footer>
  <script src="/app.js"></script>
</body>
</html>
