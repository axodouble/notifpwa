<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{.AppName}}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f1115">
  <script>window.VAPID_PUBLIC_KEY = "{{.VapidPublicKey}}";</script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1115; color: #e7e9ee;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 420px; text-align: center;
      background: #171a21; border: 1px solid #262b36; border-radius: 18px;
      padding: 32px 24px;
    }
    img.icon { width: 88px; height: 88px; border-radius: 20px; }
    h1 { font-size: 22px; margin: 16px 0 4px; }
    p.sub { color: #99a0af; margin: 0 0 24px; }
    button {
      width: 100%; padding: 14px 18px; font-size: 16px; font-weight: 600;
      border: 0; border-radius: 12px; cursor: pointer;
      background: #6366f1; color: #fff;
    }
    button:disabled { background: #2a2f3a; color: #6b7280; cursor: default; }
    .status {
      margin-top: 18px; padding: 12px 14px; border-radius: 10px;
      font-size: 14px; background: #12151c; border: 1px solid #262b36;
    }
    .status.ok { border-color: #1f6f43; color: #7ee2a8; }
    .status.err { border-color: #7a2330; color: #f5a6b0; }
    .ios {
      margin-top: 20px; font-size: 13px; color: #8b92a1; text-align: left;
      background: #12151c; border: 1px solid #262b36; border-radius: 10px; padding: 14px;
    }
    .ios b { color: #c7ccd6; }
  </style>
</head>
<body>
  <div class="card">
    <img class="icon" src="/icon.png" alt="">
    <h1>{{.AppName}}</h1>
    <p class="sub">Get push notifications on this device</p>
    <button id="enable">Enable notifications</button>
    <div id="status" class="status">Checking…</div>
    <div class="ios" id="ios-hint" hidden>
      <b>On iPhone / iPad:</b> tap the Share icon → <b>Add to Home Screen</b>,
      then open the app from your Home Screen and press Enable. Notifications
      only work from the installed app (iOS 16.4+).
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
