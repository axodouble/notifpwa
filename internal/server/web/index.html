<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{.AppName}}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.png">
  <link rel="apple-touch-icon" href="/icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1edee">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#182027">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Lora:ital,wght@0,400..700;1,400..600&family=Rethink+Sans:wght@400..700&display=swap" rel="stylesheet">
  <script>window.VAPID_PUBLIC_KEY = "{{.VapidPublicKey}}";</script>
  <style>
    :root {
      color-scheme: light dark;

      --color-lobster-deep:   #c0424f;
      --color-lobster-deeper: #a5333f;
      --color-dim-grey:       #686963;
      --color-teal-deep:      #6f8b86;
      --color-charcoal:       #3d5467;
      --color-coarse-wool:    #182027;
      --color-smoke:          #f1edee;
      --color-rule:           #d4d9d3;

      --bg:      light-dark(var(--color-smoke), var(--color-coarse-wool));
      --surface: light-dark(#fbf9f9, #1e2831);
      --fg:      light-dark(var(--color-charcoal), var(--color-smoke));
      --muted:   var(--color-dim-grey);
      --rule:    light-dark(var(--color-rule), var(--color-charcoal));
      --accent:  var(--color-lobster-deep);
      --accent-hover: var(--color-lobster-deeper);
      --ok:      light-dark(#4f736d, #8aa29e);
      --err:     var(--color-lobster-deep);
      --code-bg: rgba(192, 66, 79, 0.06);

      --font-sans:  "Rethink Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-mono:  "DM Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --font-serif: "Lora", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font: 400 16px/1.6 var(--font-sans);
      background: var(--bg); color: var(--fg);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%; max-width: 420px; text-align: center;
      background: var(--surface); border: 1px solid var(--rule); border-radius: 14px;
      padding: 40px 28px;
    }
    img.icon {
      width: 84px; height: 84px; border-radius: 18px;
      border: 1px solid var(--rule);
    }
    .eyebrow {
      font-family: var(--font-mono); font-size: 12px; font-weight: 500;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--accent); margin: 22px 0 0;
    }
    h1 {
      font-family: var(--font-serif); font-weight: 600;
      font-size: 30px; line-height: 1.15; letter-spacing: -0.01em;
      margin: 6px 0 6px; color: var(--fg);
    }
    p.sub { color: var(--muted); margin: 0 0 26px; font-size: 15px; }
    button {
      width: 100%; padding: 14px 18px; font-size: 15px; font-weight: 600;
      font-family: var(--font-sans);
      border: 0; border-radius: 10px; cursor: pointer;
      background: var(--accent); color: var(--color-smoke);
      transition: background 0.15s ease;
    }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled {
      background: transparent; color: var(--muted);
      border: 1px solid var(--rule); cursor: default;
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .status {
      margin-top: 20px; padding: 12px 14px; border-radius: 9px;
      font-size: 14px; text-align: left;
      background: var(--bg); border: 1px solid var(--rule); color: var(--fg);
    }
    .status.ok  { border-color: var(--ok);  color: var(--ok); }
    .status.err { border-color: var(--err); color: var(--err); }
    .ios {
      margin-top: 22px; font-size: 13px; line-height: 1.6; color: var(--muted); text-align: left;
      background: var(--bg); border: 1px solid var(--rule); border-radius: 9px; padding: 14px 16px;
    }
    .ios .ios-label {
      display: block; font-family: var(--font-mono); font-size: 11px; font-weight: 500;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent);
      margin-bottom: 8px;
    }
    .ios b { color: var(--fg); font-weight: 600; }
    .rooms { text-align: left; margin-top: 26px; }
    .rooms-eyebrow { margin: 0 0 12px; }
    .room-list { display: flex; flex-direction: column; gap: 8px; }
    .room { border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--surface); }
    .room-toggle {
      width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 13px 14px; background: transparent; color: var(--fg); border: 0; border-radius: 0;
      font: inherit; font-weight: 500; cursor: pointer; text-align: left;
    }
    .room-toggle:hover { background: var(--bg); }
    .room-name { font-family: var(--font-mono); font-size: 14px; }
    .room-flags { display: flex; align-items: center; gap: 8px; }
    .room-lock { font-size: 12px; line-height: 1; }
    .room-chevron {
      width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
      transform: rotate(45deg); transition: transform 0.18s ease; flex: none;
    }
    .room-toggle[aria-expanded="true"] .room-chevron { transform: rotate(-135deg); }
    .room-panel {
      padding: 4px 14px 14px; border-top: 1px solid var(--rule);
      display: flex; flex-direction: column; gap: 12px;
    }
    .room-secret-state, .room-recent-label {
      margin: 10px 0 0; font-family: var(--font-mono); font-size: 11px; font-weight: 500;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
    }
    .room-recent-label { margin-top: 2px; }
    .room-secret-row { display: flex; gap: 8px; }
    .room-secret-input {
      flex: 1; min-width: 0; padding: 10px 12px; font: inherit; font-size: 14px; color: var(--fg);
      background: var(--bg); border: 1px solid var(--rule); border-radius: 8px;
    }
    .room-btn {
      width: auto; padding: 10px 14px; font-size: 13px; font-weight: 600; border: 0; border-radius: 8px;
      background: var(--accent); color: var(--color-smoke); cursor: pointer;
    }
    .room-btn:hover { background: var(--accent-hover); }
    .room-btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--rule); }
    .room-btn.ghost:hover { color: var(--fg); background: var(--bg); }
    .room-recent { font-size: 13px; color: var(--muted); }
    .room-recent-item { display: flex; flex-direction: column; padding: 6px 0; border-top: 1px solid var(--rule); }
    .room-recent-item:first-child { border-top: 0; }
    .room-recent-when { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
    .room-recent-text { color: var(--fg); }
    .room-leave {
      align-self: flex-start; width: auto; padding: 6px 0; font-size: 13px; font-weight: 500;
      background: transparent; border: 0; color: var(--accent); cursor: pointer;
    }
    .room-leave:hover { text-decoration: underline; }
    .room-empty { font-size: 14px; color: var(--muted); margin: 0; line-height: 1.5; }
    .room-join { display: flex; gap: 8px; margin-top: 12px; }
    .room-join input {
      flex: 1; min-width: 0; padding: 12px; border: 1px solid var(--rule); border-radius: 9px;
      background: var(--surface); color: var(--fg); font: inherit; font-size: 14px;
    }
    .room-join button { width: auto; padding: 12px 18px; }
    .room-msg {
      margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
      background: var(--bg); border: 1px solid var(--rule); color: var(--fg);
    }
    .room-msg.ok { border-color: var(--ok); color: var(--ok); }
    .room-msg.err { border-color: var(--err); color: var(--err); }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="card">
    <img class="icon" src="/icon.png" alt="">
    <p class="eyebrow">Push notifications</p>
    <h1>{{.AppName}}</h1>
    <p class="sub">Get push notifications on this device</p>
    <button id="enable">Enable notifications</button>
    <div id="status" class="status">Checking…</div>
    <div class="ios" id="ios-hint" hidden>
      <span class="ios-label">On iPhone / iPad</span>
      Tap the Share icon → <b>Add to Home Screen</b>, then open the app from your
      Home Screen and press Enable. Notifications only work from the installed
      app (iOS 16.4+).
    </div>
    <div id="rooms" class="rooms" hidden>
      <p class="eyebrow rooms-eyebrow">Rooms</p>
      <div id="room-list" class="room-list"></div>
      <form id="room-join" class="room-join">
        <input type="text" id="room-name" placeholder="Join a room by name"
               autocapitalize="off" autocomplete="off" spellcheck="false">
        <button id="room-add" type="submit">Join</button>
      </form>
      <div id="room-msg" class="room-msg" hidden></div>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
