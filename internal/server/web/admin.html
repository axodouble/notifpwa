<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.AppName}} — Admin</title>
  <link rel="icon" href="/icon.png">
  <script>window.TOKEN = "{{.Token}}";</script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1115; color: #e7e9ee; padding: 24px;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 20px; }
    .card {
      background: #171a21; border: 1px solid #262b36; border-radius: 14px;
      padding: 20px; margin-bottom: 18px;
    }
    label { display: block; font-size: 13px; color: #99a0af; margin: 12px 0 6px; }
    input[type=text], input[type=file], textarea {
      width: 100%; padding: 10px 12px; border-radius: 9px;
      background: #12151c; border: 1px solid #2a2f3a; color: #e7e9ee; font: inherit;
    }
    button {
      margin-top: 14px; padding: 11px 16px; font-weight: 600; font-size: 15px;
      border: 0; border-radius: 10px; background: #6366f1; color: #fff; cursor: pointer;
    }
    button.secondary { background: #2a2f3a; }
    .row { display: flex; align-items: center; gap: 14px; }
    img.preview { width: 56px; height: 56px; border-radius: 12px; border: 1px solid #262b36; }
    code, pre {
      background: #12151c; border: 1px solid #262b36; border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
    }
    code { padding: 2px 6px; word-break: break-all; }
    pre { padding: 12px; overflow-x: auto; }
    .muted { color: #8b92a1; font-size: 13px; }
    .count { font-size: 30px; font-weight: 700; }
    .msg { margin-top: 12px; font-size: 14px; min-height: 20px; }
    .msg.ok { color: #7ee2a8; } .msg.err { color: #f5a6b0; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>{{.AppName}} — Admin</h1>

    <div class="card">
      <div class="row">
        <img class="preview" src="/icon.png" alt="">
        <div>
          <div class="count" id="count">{{.Count}}</div>
          <div class="muted">subscribed device(s)</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top:0">Appearance</h3>
      <label>App name</label>
      <input type="text" id="name" value="{{.AppName}}">
      <label>Icon (PNG, square — 512×512 recommended)</label>
      <input type="file" id="icon" accept="image/png,image/*">
      <button id="save">Save</button>
      <div class="msg" id="save-msg"></div>
    </div>

    <div class="card">
      <h3 style="margin-top:0">Send a test</h3>
      <label>Title</label>
      <input type="text" id="t-title" value="Hello">
      <label>Body</label>
      <input type="text" id="t-body" value="It works 🎉">
      <button id="send">Send to all devices</button>
      <div class="msg" id="send-msg"></div>
    </div>

    <div class="card">
      <h3 style="margin-top:0">Devices</h3>
      <div id="devices" class="muted">Loading…</div>
    </div>

    <div class="card">
      <h3 style="margin-top:0">API</h3>
      <p class="muted">Send notifications from anywhere with this token:</p>
      <p><code id="token">{{.Token}}</code></p>
      <pre id="curl"></pre>
      <button class="secondary" id="rotate" style="margin-top:14px">Rotate token</button>
      <div class="msg" id="rotate-msg"></div>
      <button class="secondary" id="logout" style="margin-top:18px">Log out</button>
    </div>
  </div>

  <script src="/admin.js"></script>
</body>
</html>
